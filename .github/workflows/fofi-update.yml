name: Aggiornamento banca dati FOFI

# Controlla periodicamente la mail dell'Ordine e, se è arrivato un Excel con
# circolari nuove, apre una PR su `dev`, la mergia automaticamente e poi
# propaga dev → main (produzione) senza intervento manuale.
#
# Autenticazione: App Password Gmail (GMAIL_USER + GMAIL_APP_PASSWORD).
# Nessun token OAuth da rigenerare: le App Password non scadono.

on:
  schedule:
    - cron: '0 6 * * 1-6'   # lun-sab alle 06:00 UTC (~07/08 in Italia)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        run: npm ci

      - name: Scarica l'ultima mail FOFI
        id: fetch
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set +e
          node tools/fetch-fofi-email.mjs .fofi-incoming.xlsx
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" -ne 0 ]; then echo "::error::fetch mail fallito (exit $code)"; exit "$code"; fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Applica aggiornamento alla banca dati
        id: build
        if: steps.fetch.outputs.found == 'true'
        run: |
          node tools/build-fofi-db.mjs .fofi-incoming.xlsx --write | tee build.out
          rm -f .fofi-incoming.xlsx .fofi-incoming.xlsx.date
          if git diff --quiet fofi-db.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "added=$(grep -oP 'FOFI_ADDED=\K.*' build.out)" >> "$GITHUB_OUTPUT"
          fi
          rm -f build.out

      - name: Bump versione + cache PWA
        if: steps.build.outputs.changed == 'true'
        run: node tools/bump-build.mjs

      - name: Test
        if: steps.build.outputs.changed == 'true'
        run: npm test

      - name: Apri/aggiorna la Pull Request su dev
        id: pr_dev
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.build.outputs.added }}
        run: |
          set -e
          git config user.name "fofi-update-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH=auto/fofi-update
          git checkout -b "$BRANCH"
          git add fofi-db.js sw.js index.html
          git commit -m "FOFI: nuove segnalazioni (circ. $ADDED)"
          git push -f origin "$BRANCH"
          REPO="${{ github.repository }}"
          EXISTING=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&base=dev&state=open" \
            | jq -r '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING già aperta: aggiornata con il force-push."
            PR_NUM="$EXISTING"
          else
            PR_NUM=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/pulls" \
              -d "{\"title\":\"FOFI: nuove segnalazioni (circ. $ADDED)\",\"head\":\"$BRANCH\",\"base\":\"dev\",\"body\":\"Aggiornamento automatico della banca dati FOFI. Nuove circolari: $ADDED. Merge automatico in dev e deploy automatico dev→main.\"}" \
              | jq -r '.number')
            echo "PR #$PR_NUM aperta."
          fi
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Merge automatico della PR in dev
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          curl -sf -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/pulls/${{ steps.pr_dev.outputs.pr_number }}/merge" \
            -d '{"merge_method":"merge"}'
          echo "PR #${{ steps.pr_dev.outputs.pr_number }} mergiata in dev."

      - name: Deploy automatico dev → main (produzione)
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.build.outputs.added }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          BEHIND=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/compare/main...dev" | jq -r '.ahead_by')
          if [ "$BEHIND" = "0" ]; then
            echo "main già allineato a dev, nulla da fare."
            exit 0
          fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/merges" \
            -d "{\"base\":\"main\",\"head\":\"dev\",\"commit_message\":\"Merge dev → main: FOFI nuove segnalazioni (circ. $ADDED) [auto]\"}"
          echo "dev mergiato in main."
