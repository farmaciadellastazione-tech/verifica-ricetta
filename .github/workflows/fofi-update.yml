name: Aggiornamento banca dati FOFI

# Controlla periodicamente la mail e, se sono arrivate segnalazioni nuove
# (Excel storico, PDF delle circolari dell'Ordine, inoltri Federfarma SP),
# apre una PR su `dev`, la mergia automaticamente e poi
# propaga dev → main (produzione) senza intervento manuale.
#
# Autenticazione: App Password Gmail (GMAIL_USER + GMAIL_APP_PASSWORD).
# Nessun token OAuth da rigenerare: le App Password non scadono.

on:
  schedule:
    - cron: '0 6 * * 1-6'   # lun-sab alle 06:00 UTC (~07/08 in Italia)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prova a secco: mostra cosa verrebbe aggiunto, senza PR/merge/deploy'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils unzip tesseract-ocr tesseract-ocr-ita >/dev/null

      - name: Scarica le segnalazioni dalla mail
        id: fetch
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set +e
          node tools/fetch-fofi-email.mjs .fofi-incoming.xlsx
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" -ne 0 ]; then echo "::error::fetch mail fallito (exit $code)"; exit "$code"; fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Applica aggiornamento alla banca dati
        id: build
        if: steps.fetch.outputs.found == 'true'
        run: |
          : > build.out
          if [ -f .fofi-incoming.xlsx ]; then
            node tools/build-fofi-db.mjs .fofi-incoming.xlsx --write | tee -a build.out
          fi
          if [ -f .fofi-incoming.json ]; then
            node tools/apply-fofi-entries.mjs .fofi-incoming.json --write | tee -a build.out
          fi
          rm -f .fofi-incoming.xlsx .fofi-incoming.xlsx.date .fofi-incoming.json
          if git diff --quiet fofi-db.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "added=$(grep -oP 'FOFI_ADDED=\K.*' build.out | paste -sd, -)" >> "$GITHUB_OUTPUT"
          fi
          rm -f build.out

      # Se non arriva nulla da troppo tempo il formato delle mail è probabilmente
      # cambiato di nuovo: fallire in modo visibile invece di uscire in silenzio.
      - name: Controllo banca dati ferma
        if: steps.build.outputs.changed != 'true'
        run: node tools/check-fofi-stale.mjs 21

      - name: Anteprima (prova a secco)
        if: steps.build.outputs.changed == 'true' && inputs.dry_run
        run: git diff fofi-db.js

      - name: Bump versione + cache PWA
        if: steps.build.outputs.changed == 'true'
        run: node tools/bump-build.mjs

      - name: Test
        if: steps.build.outputs.changed == 'true'
        run: npm test

      - name: Apri/aggiorna la Pull Request su dev
        id: pr_dev
        if: steps.build.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.build.outputs.added }}
        run: |
          set -e
          git config user.name "fofi-update-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH=auto/fofi-update
          git checkout -b "$BRANCH"
          git add fofi-db.js sw.js index.html
          git commit -m "FOFI: nuove segnalazioni (circ. $ADDED)"
          git push -f origin "$BRANCH"
          REPO="${{ github.repository }}"
          EXISTING=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&base=dev&state=open" \
            | jq -r '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING già aperta: aggiornata con il force-push."
            PR_NUM="$EXISTING"
          else
            PR_NUM=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/pulls" \
              -d "{\"title\":\"FOFI: nuove segnalazioni (circ. $ADDED)\",\"head\":\"$BRANCH\",\"base\":\"dev\",\"body\":\"Aggiornamento automatico della banca dati FOFI. Nuove circolari: $ADDED. Merge automatico in dev e deploy automatico dev→main.\"}" \
              | jq -r '.number')
            echo "PR #$PR_NUM aperta."
          fi
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Merge automatico della PR in dev
        if: steps.build.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        # Subito dopo il force-push GitHub non ha ancora calcolato la mergeabilità
        # e il merge della PR viene rifiutato (dal 6/11 la PR #19 è rimasta
        # bloccata su "Checking for the ability to merge automatically").
        # Quindi: attesa del calcolo, merge della PR e, se GitHub lo rifiuta
        # comunque, merge diretto del branch su dev (la PR risulta chiusa come
        # mergiata). Niente `curl -f`: in caso di errore si stampa la risposta.
        run: |
          set -e
          REPO="${{ github.repository }}"
          PR="${{ steps.pr_dev.outputs.pr_number }}"
          API="https://api.github.com/repos/$REPO"
          AUTH="Authorization: Bearer $GH_TOKEN"
          for i in $(seq 1 10); do
            # risposta non JSON (5xx, rate limit): si riprova, senza far cadere lo step
            M=$(curl -s -H "$AUTH" "$API/pulls/$PR" | jq -r '.mergeable' 2>/dev/null || echo null)
            [ "$M" != "null" ] && break
            sleep 3
          done
          echo "Mergeabilità PR #$PR: $M"
          CODE=$(curl -s -o "$RUNNER_TEMP/merge.out" -w '%{http_code}' -X PUT -H "$AUTH" \
            -H "Content-Type: application/json" \
            "$API/pulls/$PR/merge" -d '{"merge_method":"merge"}' || true)
          if [ "$CODE" = "200" ]; then
            echo "PR #$PR mergiata in dev."
            exit 0
          fi
          echo "Merge della PR rifiutato (HTTP $CODE): $(cat "$RUNNER_TEMP/merge.out")"
          CODE=$(curl -s -o "$RUNNER_TEMP/merge.out" -w '%{http_code}' -X POST -H "$AUTH" \
            -H "Content-Type: application/json" \
            "$API/merges" \
            -d "{\"base\":\"dev\",\"head\":\"auto/fofi-update\",\"commit_message\":\"Merge PR #$PR: FOFI nuove segnalazioni [auto]\"}" || true)
          case "$CODE" in
            201) echo "auto/fofi-update mergiato direttamente in dev (PR #$PR)." ;;
            204) echo "dev contiene già auto/fofi-update." ;;
            *) echo "::error::merge in dev fallito (HTTP $CODE): $(cat "$RUNNER_TEMP/merge.out")"; exit 1 ;;
          esac

      - name: Deploy automatico dev → main (produzione)
        if: steps.build.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.build.outputs.added }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          BEHIND=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/compare/main...dev" | jq -r '.ahead_by')
          if [ "$BEHIND" = "0" ]; then
            echo "main già allineato a dev, nulla da fare."
            exit 0
          fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/merges" \
            -d "{\"base\":\"main\",\"head\":\"dev\",\"commit_message\":\"Merge dev → main: FOFI nuove segnalazioni (circ. $ADDED) [auto]\"}"
          echo "dev mergiato in main."
